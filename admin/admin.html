<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin JamesGrill House</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
    <a href="../index.html" class="logo"><img src="../images/favicon-badge.jpg" alt="JamesGrill House logo" class="logo-mark"> JamesGrill House <span style="font-family:var(--font-body); font-size:1.2rem; text-transform:uppercase; color:var(--text-muted); margin-left:1rem;">Admin</span></a>
    <div class="header-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"><i class="fa-solid fa-sun"></i></button>
        <button class="btn small outline" id="logoutBtn" style="display:none;">Log Out</button>
    </div>
</header>

<!-- LOGIN -->
<section class="admin-shell admin-login" id="adminLogin">
    <span class="eyebrow" style="justify-content:center; display:flex;">Staff Only</span>
    <h1 class="heading">Admin <span>login</span></h1>
    <div class="form-card" style="margin-top:2.6rem;">
        <form id="loginForm">
            <div class="field">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required maxlength="254" autocomplete="username" placeholder="you@jamesgrillhouse.com">
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required maxlength="128" autocomplete="current-password" placeholder="••••••••">
            </div>
            <div class="cf-turnstile" id="turnstileWidget" data-sitekey="0x4AAAAAAEM_W1SSokbkDqtf" data-callback="onTurnstileVerified" data-theme="auto" style="margin-bottom:1.6rem;"></div>
            <button type="submit" class="btn block">Log In <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            <div class="admin-error" id="loginError"></div>
        </form>
    </div>
</section>

<!-- DASHBOARD -->
<section class="admin-shell" id="adminDashboard" style="display:none;">
    <div class="admin-header">
        <div>
            <span class="eyebrow">Dashboard</span>
            <h1 class="heading">Manage <span>the grill</span></h1>
        </div>
    </div>

    <div class="admin-tabs">
        <button data-tab="orders" class="active">Orders</button>
        <button data-tab="menu">Menu</button>
        <button data-tab="reviews">Reviews</button>
    </div>

    <!-- ORDERS TAB -->
    <div class="admin-panel active" id="ordersPanel">
        <div id="ordersAdminList"></div>
    </div>

    <!-- REVIEWS TAB -->
    <div class="admin-panel" id="reviewsPanel">
        <div id="reviewsAdminList"></div>
    </div>

    <!-- MENU TAB -->
    <div class="admin-panel" id="menuPanel">
        <div class="menu-admin-toolbar">
            <button class="btn small" id="addItemBtn"><i class="fa-solid fa-plus"></i> Add Item</button>
        </div>
        <table class="menu-admin-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price (Le)</th>
                    <th>Badge</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="menuAdminBody"></tbody>
        </table>
    </div>
</section>

<!-- ADD/EDIT ITEM MODAL -->
<div class="admin-modal-backdrop" id="itemModalBackdrop">
    <div class="admin-modal">
        <h3 id="itemModalTitle">Add Menu Item</h3>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <div class="field">
                <label for="itemName">Name</label>
                <input type="text" id="itemName" required placeholder="e.g. Grilled Half Chicken">
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="itemCategory">Category</label>
                    <select id="itemCategory" required>
                        <option value="grills">Grills</option>
                        <option value="wraps">Wraps</option>
                        <option value="snacks">Snacks</option>
                        <option value="drinks">Drinks</option>
                    </select>
                </div>
                <div class="field">
                    <label for="itemBadge">Badge (optional)</label>
                    <input type="text" id="itemBadge" placeholder="e.g. Popular">
                </div>
            </div>
            <div class="field">
                <label for="itemDesc">Description</label>
                <textarea id="itemDesc" required placeholder="Short description shown on the menu"></textarea>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="itemPriceMin">Price Min (Le)</label>
                    <input type="number" id="itemPriceMin" required min="0">
                </div>
                <div class="field">
                    <label for="itemPriceMax">Price Max (Le)</label>
                    <input type="number" id="itemPriceMax" required min="0">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="itemImage">Image path</label>
                    <input type="text" id="itemImage" placeholder="images/example.jfif">
                </div>
                <div class="field">
                    <label for="itemIcon">Fallback icon (Font Awesome class)</label>
                    <input type="text" id="itemIcon" placeholder="fa-fire">
                </div>
            </div>
            <div class="field">
                <label for="itemRating">Rating (1–5)</label>
                <input type="number" id="itemRating" min="1" max="5" value="4" required>
            </div>
            <div class="field">
                <label for="itemVariants">Flavor/Type options (optional)</label>
                <input type="text" id="itemVariants" placeholder="e.g. Coca-Cola, Fanta, Sprite, Bottled Water">
            </div>
            <div class="admin-modal-actions">
                <button type="submit" class="btn block">Save Item</button>
                <button type="button" class="btn outline block" id="cancelItemBtn">Cancel</button>
            </div>
            <div class="admin-error" id="itemFormError"></div>
        </form>
    </div>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script src="admin.js"></script>
</body>
</html>
